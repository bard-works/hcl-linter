---
version: '2'

linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - funlen
    - gocyclo
    - godot
    - gosec
    - govet
    - misspell
    - nilerr
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
    gosec:
      excludes:
        - G104
        - G115
        - G304
        - G706
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*text/tabwriter.Writer).Flush
        - (io.Writer).Flush
    govet:
      enable-all: true
      disable:
        - shadow
        - fieldalignment
    gocyclo:
      min-complexity: 20
    godot:
      scope: declarations
    staticcheck:
      checks: ['all', '-ST1000', '-ST1020']
    funlen:
      lines: 150
      statements: 80
      ignore-comments: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - funlen
      - path: _test\.go
        text: 'G101|G104|G301|G302|G304|G306'
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
    - golines
  settings:
    golines:
      max-len: 120

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  tests: true
