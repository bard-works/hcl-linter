name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            ext: ''
          - os: ubuntu-latest
            target: linux-arm64
            ext: ''
          - os: macos-latest
            target: darwin-amd64
            ext: ''
          - os: macos-latest
            target: darwin-arm64
            ext: ''
          - os: windows-latest
            target: windows-amd64
            ext: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build
        env:
          GOOS: ${{ startsWith(matrix.target, 'darwin') && 'darwin' || 'linux' }}
          GOARCH: ${{ contains(matrix.target, 'arm64') && 'arm64' || 'amd64' }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -ldflags "-X main.Version=${{ steps.version.outputs.VERSION }} -X main.BuildDate=$(date -u +"%Y-%m-%dT%H:%M:%SZ") -X main.GitCommit=${{ github.sha }}" -o dist/hcl-linter-${{ matrix.target }}${{ matrix.ext }} ./cmd/hcl-linter

      - name: Checksum
        run: |
          cd dist
          sha256sum hcl-linter-${{ matrix.target }}${{ matrix.ext }} > hcl-linter-${{ matrix.target }}${{ matrix.ext }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hcl-linter-${{ matrix.target }}${{ matrix.ext }}
          path: dist/hcl-linter-${{ matrix.target }}${{ matrix.ext }}
          retention-days: 5

      - name: Upload checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hcl-linter-${{ matrix.target }}${{ matrix.ext }}.sha256
          path: dist/hcl-linter-${{ matrix.target }}${{ matrix.ext }}.sha256
          retention-days: 5

  source:
    name: Source Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create source archive
        run: |
          git archive --format=tar.gz --prefix="hcl-linter-${{ steps.version.outputs.VERSION }}/" -o "dist/hcl-linter-${{ steps.version.outputs.VERSION }}-source.tar.gz" HEAD

      - name: Upload source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source
          path: dist/hcl-linter-${{ steps.version.outputs.VERSION }}-source.tar.gz
          retention-days: 5

  release:
    name: Create Release
    needs: [build, source]
    runs-on: ubuntu-latest
    outputs:
      upload-url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Prepare artifacts
        run: |
          cd dist
          # Rename artifacts to remove artifact suffixes
          for dir in */; do
            if [ -d "$dir" ]; then
              mv "$dir"* . 2>/dev/null || true
            fi
          done
          # Remove empty directories
          rm -rf */
          ls -la

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          version: ${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            hcl-linter-*
            *.sha256
