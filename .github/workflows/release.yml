name: Release

# Push a tag (vX.Y.Z, or vX.Y.Z-alpha.N for a pre-release) to publish:
# archives + checksums + source to GitHub Releases, a multi-arch image to
# ghcr.io/bard-works/hcl-linter, and (stable tags only) the Homebrew cask in
# bard-works/homebrew-tap. Every archive gets a build-provenance attestation.
#
# Requires the HOMEBREW_TAP_GITHUB_TOKEN secret: a fine-grained token with
# contents:write on bard-works/homebrew-tap.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # changelog and version need full history and tags

      - name: Check VERSION matches the tag
        # The GitHub Action installs the version in VERSION, so a tag that
        # disagrees with it would ship an action that installs another release.
        run: |
          have="$(tr -d '[:space:]' < VERSION)"
          if [ "$have" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error file=VERSION::VERSION is $have but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-checksums: dist/checksums.txt
