name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ''
          - os: ubuntu-latest
            target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ''
          - os: macos-latest
            target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ''
          - os: macos-latest
            target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ''
          - os: windows-latest
            target: windows-amd64
            goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'

      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          go build \
            -trimpath \
            -ldflags "-s -w -X main.Version=${{ steps.version.outputs.VERSION }} -X main.BuildDate=${BUILD_DATE} -X main.GitCommit=${{ github.sha }}" \
            -o "dist/hcl-linter${{ matrix.ext }}" \
            ./cmd/hcl-linter

      - name: Package
        id: package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          STAGE="hcl-linter-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${STAGE}"
          mv "dist/hcl-linter${{ matrix.ext }}" "dist/${STAGE}/"
          cp LICENSE README.md "dist/${STAGE}/"
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ARCHIVE="${STAGE}.zip"
            7z a "${ARCHIVE}" "${STAGE}" > /dev/null
          else
            ARCHIVE="${STAGE}.tar.gz"
            tar -czf "${ARCHIVE}" "${STAGE}"
          fi
          openssl dgst -sha256 -r "${ARCHIVE}" > "${ARCHIVE}.sha256"
          rm -rf "${STAGE}"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/${{ steps.package.outputs.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hcl-linter-${{ matrix.target }}
          path: |
            dist/${{ steps.package.outputs.archive }}
            dist/${{ steps.package.outputs.archive }}.sha256
          retention-days: 5

  source:
    name: Source Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create source archive
        id: archive
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.VERSION }}"
          ARCHIVE="hcl-linter-${VERSION}-source.tar.gz"
          git archive --format=tar.gz --prefix="hcl-linter-${VERSION}/" -o "dist/${ARCHIVE}" HEAD
          (cd dist && openssl dgst -sha256 -r "${ARCHIVE}" > "${ARCHIVE}.sha256")
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Attest source provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/${{ steps.archive.outputs.archive }}

      - name: Upload source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source
          path: |
            dist/${{ steps.archive.outputs.archive }}
            dist/${{ steps.archive.outputs.archive }}.sha256
          retention-days: 5

  release:
    name: Create Release
    needs: [build, source]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/hcl-linter-*.tar.gz
            dist/hcl-linter-*.zip
            dist/*.sha256
